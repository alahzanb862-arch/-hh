name: Build APK and Deploy Website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project if needed
        run: |
          if [ ! -f "app/build.gradle.kts" ]; then
            ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
            if [ -z "$ZIP_FILE" ]; then
              echo "No zip file or Android project found!"
              exit 1
            fi
            mkdir -p _extracted
            unzip -q "$ZIP_FILE" -d _extracted
            SETTINGS_FILE=$(find _extracted -name "settings.gradle.kts" | head -n 1)
            if [ -z "$SETTINGS_FILE" ]; then
              echo "settings.gradle.kts not found inside zip!"
              exit 1
            fi
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            cp -r "$PROJECT_DIR"/* .
            rm -rf _extracted
          fi

      - name: Prepare Gradle config and licenses
        run: |
          sed -i '/signingConfigs.getByName("debugConfig")/d' app/build.gradle.kts
          touch .env
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare website files
        run: |
          mkdir -p dist
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          cp "$APK_PATH" dist/CallAI.apk
          if [ -f "index.html" ]; then
            cp index.html dist/index.html
          elif [ -f "index (1).html" ]; then
            cp "index (1).html" dist/index.html
          else
            echo '<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحميل CallAI</title></head><body style="font-family:sans-serif;text-align:center;padding:40px;background:#0B141A;color:#fff"><h1>تحميل تطبيق CallAI</h1><p><a href="./CallAI.apk" download="CallAI.apk" style="display:inline-block;padding:16px 28px;background:#00E676;color:#000;border-radius:12px;text-decoration:none;font-weight:bold">تنزيل CallAI.apk</a></p></body></html>' > dist/index.html
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CallAI-apk
          path: dist/CallAI.apk

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
